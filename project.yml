name: Filit
options:
  bundleIdPrefix: com.filit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Filit:
    type: application
    platform: macOS
    sources:
      - path: Filit
        excludes:
          - Info.plist
    info:
      path: Filit/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Filit
        NSHumanReadableCopyright: "Copyright © 2026 Filit contributors"
        CFBundleURLTypes:
          - CFBundleURLName: Filit
            CFBundleURLSchemes:
              - filit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filit.app
        PRODUCT_NAME: Filit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Filit/Filit.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Filit/Filit.entitlements
